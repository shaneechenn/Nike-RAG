<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nike Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    var t = localStorage.getItem('nike-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --user-bubble: #f0f0f0;
    --user-text: #2563eb;
    --card-bg: #ffffff;
    --input-bg: #ffffff;
    --panel-bg: #ffffff;
    --blue: #2563eb;
    --logo: #000000;
  }
  [data-theme="dark"] {
    --bg: #343541;
    --surface: #343541;
    --text: #ececf1;
    --muted: #9ca3af;
    --border: #4d4d4f;
    --user-bubble: #2f2f2f;
    --user-text: #8ab4ff;
    --card-bg: #3e3f4b;
    --input-bg: #40414f;
    --panel-bg: #202123;
    --blue: #4f7dff;
    --logo: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .chat { width: 100%; max-width: 840px; height: 100vh; display: flex; flex-direction: column; }
  .header {
    padding: 16px 22px;
    font-size: 19px;
    font-weight: 650;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .logo { fill: var(--logo); width: 24px; height: 24px; flex-shrink: 0; }

  /* Fixed "NIKE" wordmark in the top-left corner (like the gear bottom-left) */
  .nike-wordmark {
    position: fixed;
    top: 16px;
    left: 18px;
    font-size: 24px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: 0.03em;
    color: var(--logo);
    text-decoration: none;
    cursor: pointer;
    z-index: 20;
  }
  .nike-wordmark:hover { opacity: 0.75; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .greeting {
    margin: auto;
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    color: var(--muted);
  }

  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }

  /* Rectangle bubble with soft rounded corners */
  .msg.user .bubble {
    background: var(--user-bubble);
    border-radius: 10px;
    padding: 10px 16px;
    color: var(--user-text);
    font-weight: 500;
    white-space: pre-wrap;
    max-width: 76%;
    text-align: left;
  }
  .msg.assistant .content { max-width: 76%; display: flex; flex-direction: column; gap: 10px; }
  .answer { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }

  details.products {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    background: var(--surface);
  }
  details.products summary {
    cursor: pointer; font-weight: 600; color: var(--muted);
    user-select: none; list-style: none;
  }
  details.products summary::before { content: "▸ "; }
  details.products[open] summary::before { content: "▾ "; }

  .product-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
    background: var(--card-bg);
  }
  .product-card .name { font-weight: 650; margin-bottom: 2px; }
  .product-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .product-card .desc { font-size: 14px; opacity: 0.85; }

  /* typing indicator (three bouncing dots) */
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* card reveal animation */
  .product-card { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-bar {
    display: flex;
    padding: 12px 22px 18px;
    border-top: 1px solid var(--border);
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--input-bg);
    padding: 5px 6px 5px 16px;
  }
  .input-wrap:focus-within { border-color: #d1d5db; }
  .input-bar input {
    flex: 1;
    padding: 8px 0;
    font-size: 15px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
  }
  .send-btn {
    width: 32px; height: 32px;
    border: none; border-radius: 50%;
    background: var(--blue); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .send-btn svg { fill: #fff; }
  .send-btn:disabled { background: var(--border); cursor: default; }

  /* Settings gear + panel */
  .gear-btn {
    position: fixed; left: 18px; bottom: 18px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel-bg); color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .gear-btn:hover { background: var(--surface); }
  .settings-panel {
    position: fixed; left: 18px; bottom: 66px;
    width: 240px; background: var(--panel-bg);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    padding: 14px; z-index: 21;
  }
  .settings-panel.hidden { display: none; }
  .settings-title { font-weight: 700; margin-bottom: 8px; font-size: 15px; }
  .settings-section {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 6px 0 8px;
  }
  .theme-row { display: flex; gap: 8px; }
  .theme-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
  }
  .theme-btn.active { border-color: var(--blue); color: var(--blue); font-weight: 600; }
</style>
</head>
<body>
  <div class="chat">
    <div class="header">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.6 7.2c-.4-.4-1.2-.6-2.2-.4-1 .2-2.2.6-3.4 1.2-1.2.6-2.4 1.4-3.6 2.2-1 .7-1.9 1.4-2.7 2.1-.8.7-1.4 1.3-1.8 1.8-.4-.8-.6-1.8-.4-2.8.2-1 .6-1.9 1.2-2.6L3.2 8.2c-1.2 1-2.2 2.2-2.8 3.6-.6 1.4-.8 2.8-.6 4.2.2 1.4.8 2.6 1.8 3.4 1 .8 2.2 1.2 3.4 1.2 1.2 0 2.2-.4 3-1.2.8-.8 1.4-1.8 1.8-3 .4-1.2.6-2.4.6-3.6 0-1 .2-2 .6-3 .4-1 .9-2 1.6-3 .7-1 1.5-1.9 2.4-2.7.9-.8 1.8-1.4 2.6-1.8.8-.4 1.4-.6 1.8-.6.4 0 .6.1.6.3z"/>
      </svg>
      <span>Nike Assistant</span>
    </div>
    <div id="messages" class="messages">
      <div id="greeting" class="greeting"></div>
    </div>
    <div class="input-bar">
      <div class="input-wrap">
        <input id="query" type="text" placeholder="Ask about a Nike product…" autocomplete="off">
        <button id="send" class="send-btn" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <a class="nike-wordmark" href="https://www.nike.com/" target="_blank" rel="noopener" title="Go to Nike.com">NIKE</a>

  <button id="gearBtn" class="gear-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.87a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.63-.08.94 0 .31.03.64.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.41.33.61.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.2.11.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
    </svg>
  </button>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-title">Settings</div>
    <div class="settings-section">Preference</div>
    <div class="theme-row">
      <button class="theme-btn" data-theme="light">Light</button>
      <button class="theme-btn" data-theme="dark">Dark</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('query');
    const sendBtn = document.getElementById('send');
    const gearBtn = document.getElementById('gearBtn');
    const panel = document.getElementById('settingsPanel');
    const themeBtns = document.querySelectorAll('.theme-btn');
    const greetingEl = document.getElementById('greeting');
    const greetings = [
      "What are you looking for?",
      "What are we shopping for today?",
      "Looking for the perfect pair?",
      "What can I help you find?",
      "Ready to find your next favorite?",
      "Searching for something specific?",
      "What's on your wishlist?",
      "Let's find your next Nike.",
      "Need a recommendation?",
      "What are you in the mood for?",
    ];
    if (greetingEl) {
      greetingEl.textContent = greetings[Math.floor(Math.random() * greetings.length)];
    }

    // ---- theme ----
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('nike-theme', theme); } catch (e) {}
      themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    themeBtns.forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));

    // ---- settings gear ----
    gearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && !gearBtn.contains(e.target)) panel.classList.add('hidden');
    });

    // ---- chat ----
    function updateSend() { sendBtn.disabled = inputEl.value.trim() === ''; }
    inputEl.addEventListener('input', updateSend);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !sendBtn.disabled) send(); });
    sendBtn.addEventListener('click', send);

    function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addUser(text) {
      const m = document.createElement('div');
      m.className = 'msg user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = '/user_avatar.png';
      img.alt = '';
      m.appendChild(bubble);
      m.appendChild(img);
      messagesEl.appendChild(m);
      scrollDown();
    }

    function makeProductCard(p) {
      const card = document.createElement('div');
      card.className = 'product-card';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.title || '';
      const meta = [];
      if (p.subtitle) meta.push(p.subtitle);
      if (p.color) meta.push(p.color);
      if (p.price != null) meta.push('$' + Number(p.price).toFixed(2));
      if (p.rating != null) meta.push('⭐ ' + Number(p.rating).toFixed(1) + ' (' + (p.reviews || 0) + ' reviews)');
      const desc = document.createElement('div');
      desc.className = 'desc';
      const d = p.description || '';
      desc.textContent = d.length > 240 ? d.slice(0, 240) + '…' : d;
      card.appendChild(name);
      if (meta.length) {
        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        metaDiv.textContent = meta.join(' · ');
        card.appendChild(metaDiv);
      }
      card.appendChild(desc);
      return card;
    }

    function addThinking() {
      const m = document.createElement('div');
      m.className = 'msg assistant';
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = '/assistant_avatar.png';
      img.alt = '';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      m.appendChild(img);
      m.appendChild(typing);
      messagesEl.appendChild(m);
      scrollDown();
      return m;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function typeText(el, text, msPerChar) {
      for (let i = 1; i <= text.length; i++) {
        el.textContent = text.slice(0, i);
        scrollDown();
        await sleep(msPerChar);
      }
    }

    async function addAssistantReply(data) {
      const answer = data.answer || '';
      const products = data.products || [];

      const m = document.createElement('div');
      m.className = 'msg assistant';
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = '/assistant_avatar.png';
      img.alt = '';
      const content = document.createElement('div');
      content.className = 'content';

      m.appendChild(img);
      m.appendChild(content);
      messagesEl.appendChild(m);
      scrollDown();

      // 1) Typewriter text reply
      if (answer) {
        const answerEl = document.createElement('div');
        answerEl.className = 'answer';
        content.appendChild(answerEl);
        await typeText(answerEl, answer, 5);
        await sleep(180);
      }

      // 2) Then reveal product cards one-by-one
      if (!products.length) {
        const p = document.createElement('div');
        p.textContent = 'No matching products found.';
        p.style.color = 'var(--muted)';
        content.appendChild(p);
      } else {
        const details = document.createElement('details');
        details.className = 'products';
        details.open = true;
        const summary = document.createElement('summary');
        summary.textContent = 'View ' + products.length + ' recommended products';
        details.appendChild(summary);
        content.appendChild(details);

        for (let i = 0; i < products.length; i++) {
          details.appendChild(makeProductCard(products[i]));
          scrollDown();
          await sleep(220);
        }
      }
      scrollDown();
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      updateSend();
      addUser(text);
      if (greetingEl) greetingEl.style.display = 'none';

      const thinking = addThinking();

      let data = { answer: null, products: [] };
      try {
        const res = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text })
        });
        data = await res.json();
      } catch (err) {
        data = { answer: null, products: [] };
      }

      thinking.remove();
      addAssistantReply(data);
    }
  </script>
</body>
</html>
